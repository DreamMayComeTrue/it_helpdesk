<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
  <title>Register · FixDesk</title>
</head>
<body>
<main class="fixdesk-narrow mx-auto">
  <h1 class="h3 mb-3">Create an account</h1>
  <p class="text-body-secondary">For students and staff who need to report an IT problem.</p>

  <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
    <input th:replace="~{layout/fragments :: csrf}">

    <div class="mb-3">
      <label for="name" class="form-label">Full name</label>
      <input type="text" id="name" class="form-control" th:field="*{name}"
             th:errorclass="is-invalid" maxlength="100" autocomplete="name" required autofocus>
      <div class="invalid-feedback" th:errors="*{name}"></div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" class="form-control" th:field="*{email}"
             th:errorclass="is-invalid" maxlength="150" autocomplete="username" required>
      <div class="invalid-feedback" th:errors="*{email}"></div>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" id="password" name="password" class="form-control"
             th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
             autocomplete="new-password" required>
      <div class="invalid-feedback" th:errors="*{password}"></div>
    </div>

    <div class="mb-3">
      <label for="confirmPassword" class="form-label">Password again</label>
      <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
             th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
             autocomplete="new-password" required>
      <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
    </div>

    <button type="submit" class="btn btn-primary w-100">Register</button>
  </form>

  <p class="mt-3 mb-0">Already registered? <a th:href="@{/login}">Log in</a></p>
</main>
</body>
</html>
